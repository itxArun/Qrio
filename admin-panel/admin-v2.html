<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qrio - Smart Dashboard</title>
    <!-- Premium Font (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons (Best icons for SaaS) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Linking our new CSS -->
    <link rel="stylesheet" href="admin-v2.css">
</head>
<body>
    <div class="app-container">
        
        <!-- PART A: The Clean Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2><i class="ph-fill ph-pizza"></i> Qrio.</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active"><i class="ph-bold ph-squares-four"></i> Dashboard</a>
                <a href="#" class="nav-item"><i class="ph-bold ph-receipt"></i> Live Orders</a>
                <a href="#" class="nav-item"><i class="ph-bold ph-fork-knife"></i> Menus</a>
                <a href="#" class="nav-item"><i class="ph-bold ph-users"></i> Customers</a>
                <a href="#" class="nav-item"><i class="ph-bold ph-gear"></i> Settings</a>
            </nav>
        </aside>

        <!-- PART B: Main Content Area -->
        <main class="main-content">
            
           <!-- The Premium Header -->
            <header class="top-header">
                <!-- Left Side: Menu & Search -->
                <div class="header-left">
                    <button class="hamburger-btn"><i class="ph-bold ph-list"></i></button>
                    <div class="search-bar">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" placeholder="Search here...">
                    </div>
                </div>
                
                <!-- Right Side: Action Icons & Profile -->
                <div class="header-right">
                    <div class="action-icons">
                        <div class="icon-btn icon-purple"><i class="ph-bold ph-qr-code"></i></div>
                        <div class="icon-btn icon-blue">
                            <i class="ph-bold ph-bell"></i>
                            <span class="badge"></span>
                        </div>
                        <div class="icon-btn icon-lightblue"><i class="ph-bold ph-chat-teardrop-dots"></i></div>
                        <div class="icon-btn icon-orange"><i class="ph-bold ph-gear"></i></div>
                    </div>
                    
                    <div class="header-profile">
                        <div class="profile-text">
                            <span class="greeting">Hello,</span>
                            <span class="name">Arun</span>
                        </div>
                        <div class="profile-pic">
                            <img src="https://ui-avatars.com/api/?name=Arun&background=FF6B00&color=fff" alt="Profile">
                        </div>
                    </div>
                </div>
            </header>
            
            <!-- PART C: The Workspace -->
        <div class="dashboard-workspace">
            
            <!-- The 4 Features / KPI Cards -->
            <div class="kpi-grid">
                
                <!-- Card 1: Total Menu -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <p>Total Menu</p>
                        <h3>325</h3>
                    </div>
                    <div class="kpi-icon" style="color: #FF6B00; background: rgba(255, 107, 0, 0.1);">
                        <i class="ph-bold ph-pizza"></i>
                    </div>
                </div>

                <!-- Card 2: Total Revenue -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <p>Total Revenue</p>
                        <h3>₹425k</h3>
                    </div>
                    <div class="kpi-icon" style="color: #20c997; background: rgba(32, 201, 151, 0.1);">
                        <i class="ph-bold ph-currency-inr"></i>
                    </div>
                </div>

                <!-- Card 3: Total Orders -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <p>Total Orders</p>
                        <h3>415</h3>
                    </div>
                    <div class="kpi-icon" style="color: #4361ee; background: rgba(67, 97, 238, 0.1);">
                        <i class="ph-bold ph-shopping-cart"></i>
                    </div>
                </div>

                <!-- Card 4: Total Customers -->
                <div class="kpi-card">
                    <div class="kpi-info">
                        <p>Total Customers</p>
                        <h3>985</h3>
                    </div>
                    <div class="kpi-icon" style="color: #f5b700; background: rgba(245, 183, 0, 0.1);">
                        <i class="ph-bold ph-users"></i>
                    </div>
                </div>

            </div>
            
        </div>
                <h2 style="color: var(--text-main); margin-bottom: 5px;">Welcome back, Arun! 👋</h2>
                <p style="color: var(--text-sub); margin-bottom: 30px; font-size: 14px;">Here is what's happening with your restaurant today.</p>
                
                <!-- Yahan hum agle step me wo 4 Sundar Dabbe (Cards) daalenge -->
            </div>
            
        </main>
    </div>
</body>
</html>
